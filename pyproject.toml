[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switch-tax"
version = "0.2.0"
description = "Local agent task transition accounting"
requires-python = ">=3.11"

[project.scripts]
switch-tax = "switch_tax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
